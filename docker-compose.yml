version: '3.8'

services:
  nexus-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3

  nexus-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - nexus-backend
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge
